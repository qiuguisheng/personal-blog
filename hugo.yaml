baseURL: https://qiuguisheng.github.io/personal-blog/ 
languageCode: zh-cn
title: 邱桂生的blog
theme: PaperMod
defaultContentLanguage: zh

# 启用 emoji 支持
enableEmoji: true

# 启用 robots.txt
enableRobotsTXT: true

# 每页显示的文章数
pagination:
  pagerSize: 5

# 语言设置
languages:
  zh:
    languageName: "中文"
    weight: 1

# PaperMod 主题配置
params:
  # 基础信息
  author: "qiuguisheng"
  description: "记录、思考、探索"
  defaultTheme: dark
  
  # 显示设置
  ShowReadingTime: true      # 显示阅读时间
  ShowShareButtons: true     # 显示分享按钮
  ShowPostNavLinks: true     # 显示上一篇/下一篇
  ShowBreadCrumbs: true      # 显示面包屑导航
  ShowCodeCopyButtons: true  # 显示代码复制按钮
  ShowWordCount: true        # 显示字数统计
  ShowRssButtonInSectionTermList: true
  
  # 首页模式（三选一）
  # homeInfoParams:          # Home-Info 模式
  #   Title: "欢迎来到我的博客"
  #   Content: "这里是描述文字"
  
profileMode:
  enabled: true
  title: "邱桂生 · 基础设施与自动化解决方案"
  subtitle: "20年运维经验 | Python自动化 | 云原生与混合云架构 | 承接技术咨询与项目交付"
  imageUrl: "images/avatar.jpg"
  imageWidth: 120
  imageHeight: 120
  buttons:
    - name: 查看项目案例
      url: projects/
    - name: 联系合作
      url: contact/ 
  # 社交图标
  socialIcons:
    - name: github
      url: "https://qiuguisheng.github.io/personal-blog/"
      title: "访问我的 GitHub"
    - name: email
      url: "qiu_g_s@163.com"
      title: "发送邮件给我"

# 菜单配置
menu:
  main:
    - identifier: projects
      name: 项目案例
      url: /projects/
      weight: 10
    - identifier: notes
      name: 技术笔记
      url: /notes/
      weight: 20
    - identifier: about
      name: 关于我
      url: /about/
      weight: 30
    - identifier: contact
      name: 联系合作
      url: /contact/
      weight: 40
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 50
    - identifier: search
      name: 搜索
      url: /search/
      weight: 60
# 输出格式（用于搜索功能）
outputs:
  home:
    - HTML
    - RSS
    - JSON
caches:
  images:
    dir: :cacheDir/images