baseURL: https://qiuguisheng.github.io/personal-blog/ 
languageCode: zh-cn
title: 邱桂生的blog
theme: PaperMod
defaultContentLanguage: zh

# 启用 emoji 支持
enableEmoji: true

# 启用 robots.txt
enableRobotsTXT: true

# 每页显示的文章数
pagination:
  pagerSize: 10

# 语言设置
languages:
  zh:
    languageName: "中文"
    weight: 1

# PaperMod 主题配置
params:
  # 基础信息
  author: "qiuguisheng"
  description: "记录、思考、探索"
  defaultTheme: dark
  
  # 显示设置
  ShowReadingTime: true      # 显示阅读时间
  ShowShareButtons: true     # 显示分享按钮
  ShowPostNavLinks: true     # 显示上一篇/下一篇
  ShowBreadCrumbs: true      # 显示面包屑导航
  ShowCodeCopyButtons: true  # 显示代码复制按钮
  ShowWordCount: true        # 显示字数统计
  ShowRssButtonInSectionTermList: true
  
  # 首页模式（三选一）
  # homeInfoParams:          # Home-Info 模式
  #   Title: "欢迎来到我的博客"
  #   Content: "这里是描述文字"
  
  profileMode:                # Profile 模式（我选的这个）
    enabled: true
    title: "My Wilderness"    # 主标题
    subtitle: "记录、思考、探索"
    imageUrl: "images/avatar.jpg"  # 头像路径
    imageWidth: 120
    imageHeight: 120
    buttons:
      - name: 旷野
        url: posts/
      - name: 关于
        url: about/
  
  # 社交图标
  socialIcons:
    - name: github
      url: "https://qiuguisheng.github.io/personal-blog/"
      title: "访问我的 GitHub"
    - name: email
      url: "qiu_g_s@163.com"
      title: "发送邮件给我"

# 菜单配置
menu:
  main:
    - identifier: posts
      name: 随笔
      url: /posts/
      weight: 10
    - identifier: notes
      name: 笔记
      url: /notes/
      weight: 20
    - identifier: projects
      name: 项目
      url: /projects/
      weight: 30
    - identifier: about
      name: 关于
      url: /about/
      weight: 40
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 50
    - identifier: search
      name: 搜索
      url: /search/
      weight: 60

# 输出格式（用于搜索功能）
outputs:
  home:
    - HTML
    - RSS
    - JSON
caches:
  images:
    dir: :cacheDir/images